name: Deploy to Cloudflare Workers

# Build the hosted version and deploy it to the `stub` Worker on every push to
# main. The Worker already owns stub.vedantagrw.com, its KV namespace and its
# TURNSTILE_SECRET; `wrangler deploy` keeps secrets, so only code and the vars
# in wrangler.jsonc change.
#
# Deploying needs two repository secrets, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Without them (a fork, say) the run type-checks and
# builds, then skips the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Opt the bundled JS actions into Node 24 ahead of Node 20 leaving the runners.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:cloud
      - run: npm run build:cloud

      - name: Check for Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so this run skips the deploy."
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
